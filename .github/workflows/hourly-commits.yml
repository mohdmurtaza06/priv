name: Hourly Commits

on:
  schedule:
    # Every hour at minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  make-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git and make 3 commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create or update activity log with 3 sequential commits
          for i in 1 2 3; do
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "[$TIMESTAMP] Hourly update #$i" >> activity.log
            git add activity.log
            git commit -m "chore: hourly activity update $i ($TIMESTAMP)"
            git push origin HEAD:main
          done
